name: Sync horario catalogo Seminuevos

on:
  schedule:
    # Cron horario: minuto 4 de cada hora (UTC). El feed XML de Maxipublica
    # se actualiza cada hora, el offset de 4 min es deliberado para que el
    # feed ya tenga la version fresca cuando descargamos.
    # Dos ventanas por hora en vez de una. GitHub Actions retrasa y se salta
    # corridas programadas: medido el 29-ago sobre 29 corridas, promedio real
    # 2.7 h con un cron declarado de 1 h. Duplicar las ventanas no arregla el
    # scheduler pero duplica las oportunidades de que alguna caiga.
    # La proteccion de fondo es runWorkflowWatchdog en el Worker, cuyo cron de
    # Cloudflare SI es puntual — pero requiere el secreto GITHUB_TOKEN.
    - cron: '4,34 * * * *'
  workflow_dispatch:  # Permite correrlo manualmente desde la pestaña Actions

concurrency:
  group: sync-catalogo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse feed XML Maxipublica → catalogo.json
        run: python3 parser_xml_maxipublica.py

      - name: Sync a D1 vía crm-sync-worker
        env:
          CATALOG_SYNC_SECRET: ${{ secrets.CATALOG_SYNC_SECRET }}
        run: python3 sync_via_worker.py

      - name: Export catalogo piloto (D1 → JSON)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_RW_TOKEN }}
          CF_ACCOUNT_ID: 3a73c6035cae8b2bfab359a16ec44fca
          D1_DATABASE_ID: ad3e7ad8-55e0-4436-941a-6e299638af8e
        run: python3 export_catalogo_piloto.py

      - name: Sync textos marketing del HTML con inventario real
        run: python3 sync_landing_marketing.py


      - name: Commit y push catalogo-piloto.json + index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/catalogo-piloto.json docs/index.html
          git diff --cached --quiet && echo "Sin cambios en landing" || git commit -m "sync: catalogo + marketing $(date -u +%Y-%m-%dT%H:%MZ)"
          git push


      # Paridad canonica (Chucho, 28-ago-2026): el catalogo publicado debe ser
      # IDENTICO a lo que Maxipublica manda PARA LAS SUCURSALES DEL PILOTO.
      #
      # VA DESPUES DEL COMMIT, a proposito. En su primera version corria antes
      # y el 29-ago tumbo el sync 3 corridas seguidas: el script reventaba en el
      # runner y el paso de commit se saltaba, asi que el catalogo dejo de
      # publicarse. Una auditoria nunca debe poder impedir que se publique lo
      # que ya se sincronizo — solo debe reportar.
      #
      # Doble red: continue-on-error ademas de --warn.
      - name: Auditoria de paridad del catalogo
        continue-on-error: true
        run: python3 auditoria_catalogo.py --warn
      - name: Subir resumen como artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-output-${{ github.run_id }}
          path: |
            resumen_carga.txt
          if-no-files-found: ignore
          retention-days: 7
